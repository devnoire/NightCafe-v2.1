:root{
  --ink:#1a1224; --paper:#ead8b0; --paper-d:#d4bd8c; --amber:#ffb54d; --amber-l:#ffd98a;
  --night:#0b0a1c; --red:#a62b2b; --plum:#3a2a46;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#0b0a1c; } }
:root[data-theme="dark"]{ --night:#0b0a1c; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{touch-action:none;overscroll-behavior:none;height:100%;margin:0;background:var(--night);overflow:hidden;font-family:'Kalam','Segoe Print','Comic Sans MS',cursive;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgba(12,8,30,.55),rgba(6,4,16,.88));padding:2%;box-sizing:border-box}

/* ---------------- pixel sprites: drawn in code at 96x120 sprite pixels, shown at PX world px each ---------------- */
const PX=2.3,SPW=96,SPH=120,SOX=48,SOY=112;
const sprCache=new Map();
let GS=null;
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,a){const r=hexRgb(h);return'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v+a))).toString(16).padStart(2,'0')).join('');}
function pr_(x,y,w,h,c){GS.fillStyle=c;GS.fillRect(Math.round(SOX+x),Math.round(SOY+y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function pln(x0,y0,x1,y1,w,c){GS.fillStyle=c;const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const t=i/n;GS.fillRect(Math.round(SOX+x0+(x1-x0)*t-w/2),Math.round(SOY+y0+(y1-y0)*t-w/2),Math.round(w),Math.round(w));}}
function pel(cx,cy,rx,ry,c){GS.fillStyle=c;for(let y=-Math.ceil(ry);y<=Math.ceil(ry);y++)for(let x=-Math.ceil(rx);x<=Math.ceil(rx);x++)if((x*x)/(rx*rx+.01)+(y*y)/(ry*ry+.01)<=1.05)GS.fillRect(Math.round(SOX+cx+x),Math.round(SOY+cy+y),1,1);}
function ppoly(pts,c){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});GS.fillStyle=c;
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){let ins=false;const px=x+.5,py=y+.5;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>py)!==(b[1]>py))&&(px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}if(ins)GS.fillRect(Math.round(SOX+x),Math.round(SOY+y),1,1);}}

/* ---------------- werewolf sprite ---------------- */
function drawWolfRig(d,anim,fr,o){
  const L1=18,L2=17,TL=28;
  let ph=0,amp=0,kmax=0,bob=0,sit=false,lean=.34,armSw=0;
  switch(anim){
    case'walk':ph=fr/8*TAU;amp=.5;kmax=.9;bob=1.6;armSw=.5;break;
    case'run':ph=fr/8*TAU;amp=.85;kmax=1.5;bob=3.6;armSw=1.0;lean=.6;break;
    case'sit':sit=true;lean=.3;bob=fr%2?.7:0;break;
    default:bob=Math.sin(fr/6*TAU)*1.0;
  }
  const FUR='#1f1a28',MID='#312c3e',HI='#4d4866',TUFT='#5d5878',DK='#0f0c15',PUR='#7a3ac0',EYE='#d98cff',EYEC='#f6dcff',CLAW='#d4d4e6',TAILC='#3f3b50';

  if(sit){th=[1.5,1.5];sh=[.1,.1];}
  const lg=[0,1].map(i=>{const kx=Math.sin(th[i])*L1,ky=Math.cos(th[i])*L1;return{kx,ky,fx:kx+Math.sin(sh[i])*L2,fy:ky+Math.cos(sh[i])*L2};});
  const drop=Math.max(lg[0].fy,lg[1].fy);
  const hx=sit?-12:-8,hy=-drop-bob;
  const sx=hx+Math.sin(lean)*TL,sy=hy-Math.cos(lean)*TL;
  const hX=sx+9,hY=sy-9;
  // arms: [front (raised, claws up), back]
  let aU=[1.0,.25],aF=[2.5,.55];
  if(anim==='walk'||anim==='run'){const a=-armSw*Math.sin(ph);aU=[.5+a,.35-a];aF=[1.3+a*1.2,.8-a*1.2];}
  if(sit){aU=[.9,.7];aF=[1.5,1.4];}
  const arm=(i,back)=>{const S0=[sx+(back?-5:3),sy+6];const UA=15,FA=14;
    const ex=S0[0]+Math.sin(aU[i])*UA,ey=S0[1]+Math.cos(aU[i])*UA,hx2=ex+Math.sin(aF[i])*FA,hy2=ey+Math.cos(aF[i])*FA;
    const c1=back?DK:FUR;pln(S0[0],S0[1],ex,ey,9,c1);pln(ex,ey,hx2,hy2,7,c1);
    if(!back){pln(S0[0]-1,S0[1]-2,ex-1,ey-2,2,HI);pln(ex-1,ey-2,hx2-1,hy2-2,1,HI);}
    pel(hx2,hy2,4,3.5,c1);
    const dx=Math.sin(aF[i]),dy=Math.cos(aF[i]),px=-dy,py=dx;
    [-1.6,0,1.6].forEach(q=>pln(hx2+px*q,hy2+py*q,hx2+px*q+dx*7,hy2+py*q+dy*7,1.3,CLAW));};
  const leg=(i,back)=>{const Lg=lg[i];const c1=back?DK:FUR;
    pln(hx,hy,hx+Lg.kx,hy+Lg.ky,12,c1);
    pln(hx+Lg.kx,hy+Lg.ky,hx+Lg.fx,hy+Lg.fy,7,c1);
    const fx=hx+Lg.fx,fy=hy+Lg.fy;pr_(fx-3,fy-3,13,4,c1);[2,5,8].forEach(q=>pr_(fx+q+2,fy,1,3,CLAW));

function amb(t,d,f,q,g,type,att){

  const fl=ac.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q||1;

      if(rnd()<.06)clink(t+rnd()*.2,2400+rnd()*1200,.025);

  try{const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const p=f.call(el);if(p&&p.catch)p.catch(()=>{});}}catch(e){}

const BTN={id:null,x0:0,y0:0,dx:0,dy:0,fired:false};
const BCX=()=>VW-96,BCY=()=>VH-128,BR=50;
function stairsHere(){return R&&!R.trans&&Math.abs(R.p.x-STAIR)<46;}
function curAction(){if(!R||R.paused||R.over||mode!=='play'||R.trans||R.p.act)return null;if(stairsHere())return{stairs:true};const o=nearest(interactables());return o?{o}:null;}
let walkId=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();goFull();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=lpos(e);
  for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h){h.fn();return;}}
  if(!R||R.paused||R.over||mode!=='play')return;
  if(Math.hypot(p[0]-BCX(),p[1]-BCY())<BR+16&&BTN.id===null){
    BTN.id=e.pointerId;BTN.x0=p[0];BTN.y0=p[1];BTN.dx=0;BTN.dy=0;BTN.fired=false;
    const a=curAction();
    if(a&&a.o){pressed.KeyE=true;BTN.fired=true;}
    else if(a&&a.stairs){const up=R.p.f<2,dn=R.p.f>0;if(up&&!dn){pressed.KeyW=true;BTN.fired=true;}else if(dn&&!up){pressed.KeyS=true;BTN.fired=true;}}
    return;
  }
  if(walkId!==null)return;
  walkId=e.pointerId;ptr.sx=p[0];ptr.sy=p[1];
  const now=performance.now();ptr.sprint=now-ptr.last<340;ptr.last=now;ptr.down=true;R.p.target=cam.x+p[0];
});
cv.addEventListener('pointermove',e=>{const p=lpos(e);
  if(e.pointerId===walkId){ptr.sx=p[0];ptr.sy=p[1];}
  else if(e.pointerId===BTN.id){BTN.dx=p[0]-BTN.x0;BTN.dy=p[1]-BTN.y0;
    if(!BTN.fired&&R&&stairsHere()){if(BTN.dy<-26&&R.p.f<2){pressed.KeyW=true;BTN.fired=true;}else if(BTN.dy>26&&R.p.f>0){pressed.KeyS=true;BTN.fired=true;}}}
});
const upP=e=>{if(e&&e.pointerId===BTN.id){BTN.id=null;BTN.dx=BTN.dy=0;return;}
  if(e&&walkId!==null&&e.pointerId!==walkId)return;walkId=null;ptr.down=false;ptr.sprint=false;};
cv.addEventListener('pointerup',upP);cv.addEventListener('pointercancel',upP);cv.addEventListener('lostpointercapture',upP);

function pickDish(type){

function spawnCustomer(wolf){
  let free=R.tables.filter(t=>t.open&&t.state==='free'&&!(R.wolfNight&&!R.wolfDone&&t.i===WOLF_TABLE));
  if(wolf)free=R.tables.filter(t=>t.i===WOLF_TABLE&&t.open&&t.state==='free');
  if(!free.length)return false;
  const hr=R.clock/60;
  let type=CUST[Math.floor(Math.random()*CUST.length)];
  if(wolf)type=WOLFC;
  else if(save.night>=5&&hr>=2.5&&Math.random()<.12&&!R.cust.some(c=>c.type.ghost))type=GHOST;
  else if(save.night>=3&&Math.random()<.1&&!R.cust.some(c=>c.type.critic))type=CRITIC;
  const w=free.map(t=>t.f===0?3:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),ti=0;for(;ti<free.length;ti++){r-=w[ti];if(r<=0)break;}

  if(wolf){c.umb=false;c.side=-1;}

  c.want=[];for(let i=0;i<nd;i++){c.want.push(type.ghost?(i===0?'tea':(save.menu.includes('cake')?'cake':'tea')):pickDish(type));}

}
function moveTo(c,tx,dt,sp){const d=tx-c.x;if(Math.abs(d)<4)return true;c.face=Math.sign(d);const sp0=sp||(c.type&&c.type.wolf?135:95);c.x+=Math.sign(d)*Math.min(Math.abs(d),sp0*dt);c.ph+=dt*9;return false;}
function patRate(c){let r=1;if(R.cozy>0)r*=.8;if(R.mood===1)r*=.9;if(c.f===2&&R.leak.puddle)r*=1.3;if(R.power.off)r*=1.25;return r;}
function updateCust(dt){
  for(const c of R.cust){
    const tb=R.tables[c.table];const seatX=tb.x+c.side*50;
    if(c.state==='enter'){
      if(tb.f===2&&!c.climbed){if(moveTo(c,STAIR,dt)){c.state='climb';c.t=1;c.dir=1;c.vis=false;}}
      else if(moveTo(c,seatX,dt)){c.state='order';c.sit=true;c.umb=false;c.face=-c.side;tb.state='occupied';tb.cust=c.id;fx('txt',c.x,FY[c.f]-110,{txt:'…',col:'#fff',vy:-10,life:1});}
      if(c.x<1560)c.umb=false;
    }else if(c.state==='climb'){c.t-=dt;c.vis=false;if(c.t<=0){c.f=c.dir>0?2:0;c.x=STAIR;c.vis=true;if(c.dir>0){c.climbed=true;c.state='enter';}else c.state='exit';}}
    else if(c.state==='order'){c.orderPat-=dt*patRate(c);if(c.orderPat<=0)angryLeave(c);}
    else if(c.state==='wait'){c.foodPat-=dt*patRate(c);if(c.foodPat<=0)angryLeave(c);}
    else if(c.state==='eat'){c.t-=dt;if(c.t<=0)finishCustomer(c);}
    else if(c.state==='leave'){
      c.sit=false;
      if(c.f===2){if(moveTo(c,STAIR,dt)){c.state='climb';c.t=1;c.dir=-1;c.vis=false;}}
      else c.state='exit';
    }
    if(c.state==='exit'){c.sit=false;if(c.x>1560)c.umb=c.type.umb&&!c.type.ghost?true:false;if(moveTo(c,W+60,dt,105)){c.dead=true;}}
  }
  R.cust=R.cust.filter(c=>!c.dead);
}
function releaseTable(c,dirty){const tb=R.tables[c.table];tb.state=dirty?'dirty':'free';tb.cust=null;}

function finishCustomer(c){

function serve(c,item){

function updateRamp(dt){

  else if(r.stage===1){r.face=1;r.x+=sp*dt;if(r.x>=1640){r.stage=2;R.shake=.5;SFX.stomp();}}

  else if(r.stage===3){r.face=1;r.x+=sp*dt;if(r.x>=1640){r.stage=4;R.shake=.5;SFX.stomp();}}

    if(r.x>=1880)R.ramp=null;}

/* ---------------- update ---------------- */
function update(dt){
  const P=R.p;
  if(R.msg){R.msg.life-=dt;if(R.msg.life<=0)R.msg=null;}
  R.fade=Math.max(0,R.fade-dt*1.4);
  if(R.paused||R.over)return;
  R.clock+=dt*R.rate;
  if(R.clock>=360){endNight();return;}
  if(R.plantCD>0)R.plantCD-=dt;if(R.shake>0)R.shake=Math.max(0,R.shake-dt*1.6);
  if(R.wolfNight&&!R.wolfSpawned&&R.clock>=R.wolfAt){if(spawnCustomer(true))R.wolfSpawned=true;}
  updateRamp(dt);updateDlg(dt);if(R.banner){R.banner.t+=dt;if(R.banner.t>6)R.banner=null;}
  // spawns
  R.spawnT-=dt;
  if(R.spawnT<=0&&R.clock<335){spawnCustomer();const hr=R.clock/60;const rush=hr>=2&&hr<4.2?1.5:1;
    R.spawnT=Math.max(7,19-save.night*1.2)/rush*(1.25-R.rep*.07)/((save.decor.includes('neon')&&!R.ruined)?1.12:1)*(.8+Math.random()*.5);}
  updateCust(dt);
  if(R.comboT>0){R.comboT-=dt;if(R.comboT<=0)R.combo=0;}
  if(R.cozy>0)R.cozy-=dt;
  // events
  if(R.flash>0)R.flash-=dt;
  R.thunderT-=dt;if(R.thunderT<=0){R.thunderT=22+Math.random()*30;if(!REDUCE)R.flash=.5;setTimeout(SFX.thunder,350);}
  if(save.night>=5){
    if(!R.leak.on){R.leak.next-=dt;if(R.leak.next<=0){R.leak.on=true;R.leak.lvl=0;toast('The roof is leaking on 3F! Empty the bucket.');}}
    else if(!R.leak.puddle){R.leak.lvl+=dt/60;if(R.leak.lvl>=1){R.leak.lvl=1;R.leak.puddle=true;toast('The bucket overflowed — grab the mop!');}}
    if(!R.power.off){R.power.next-=dt;if(R.power.next<=0){R.power.next=150+Math.random()*90;R.power.off=true;if(!REDUCE)R.flash=.6;setTimeout(SFX.thunder,200);toast('Find the Fuse box!');}}
  }
  // stations
  for(const s of R.stn){
    if(s.item&&!R.power.off&&(s.type==='stove'||s.type==='oven'||s.type==='machine'||s.type==='kettle')){
      const it=s.item;const dur=s.type==='machine'?MENU.coffee.cook:s.type==='kettle'?MENU.tea.cook:MENU[it.dish].cook;
      const before=it.prog;it.prog=Math.min(1.7,it.prog+dt/dur*(1+(Math.abs(it.prog-.76)<.22?.9:0)));
      if(before<1.1&&it.prog>=1.1){SFX.bad();toast('Something is burning!');}
      if(Math.random()<dt*(it.prog>1.1?8:2.5))fx(it.prog>1.1?'smoke':'steam',s.x+(Math.random()-.5)*20,FY[1]-110,{vy:-26,life:1.4});
    }
  }
  // player
  const run=keys.ShiftLeft||keys.ShiftRight;
  if(R.trans){R.trans.t+=dt;if(!R.trans.done&&R.trans.t>=.18){R.trans.done=true;P.f=R.trans.to;P.x=STAIR;}if(R.trans.t>=.36)R.trans=null;}
  else if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur){const fn=P.act.fn;P.act=null;fn();}}
  else{
    let dir=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
    if(dir)P.target=null;
    else{if(ptr.down)P.target=cam.x+ptr.sx;if(P.target!=null){const dd=P.target-P.x;if(Math.abs(dd)<8)P.target=null;else dir=Math.sign(dd);}}
    if(P.bounceT>0){P.bounceT-=dt;dir=0;}else if(R.ramp&&dir){P.bounceAcc+=dt;if(P.bounceAcc>.7){P.bounceAcc=0;P.bounceT=.5;SFX.pop();}}
    const wet=P.f===2&&R.leak.puddle&&Math.abs(P.x-470)<110;
    const lv=save.up.sprint;
    const want=!!dir&&lv>0&&!wet&&(run||ptr.sprint);
    if(P.exh&&P.stam>=.35)P.exh=false;
    const spr=want&&!P.exh&&P.stam>0;
    if(spr){P.stam=Math.max(0,P.stam-dt/SPR_DRAIN[lv]);if(P.stam<=0)P.exh=true;}
    else if(lv>0)P.stam=Math.min(1,P.stam+dt/SPR_REGEN[lv]);
    const sp=150*(1+.12*save.up.shoes)*(spr?SPR_MUL[lv]:1)*(wet?.55:1);
    P.moving=!!dir;P.sprinting=spr;
    if(dir){const m=dir*sp*dt;P.x+=m;P.dist+=Math.abs(m);P.face=dir;const fi=Math.floor(P.dist/(spr?13:11));if(fi!==P.lastFi&&fi%4===0)SFX.step();P.lastFi=fi;}
    if(P.chopT>0)P.chopT-=dt;

  if(R.cozy>0)text(c,'cozy 🐈',R.combo>1?130:22,104,22,'#ffb6c8','left','700',INK);
  if(R.power.off)text(c,'POWER CUT',VW/2,110,34,'#ff8a6a','center','700',INK);

  const r=rail(),sel=selTicket();
  let x=VW-12;
  for(let i=r.length-1;i>=0;i--){
    const t=r[i];const w=100,h=34+t.items.length*20;x-=w;
    const isSel=sel&&sel.id===t.id;HITS.push({x:x,y:10,w:w,h:h,fn:()=>{R.sel=t.id;SFX.pop();}});
    c.save();c.translate(x+w/2,10+(isSel?4:0)+h/2);c.rotate(((i*7)%5-2)*.012);
    rect(c,-w/2,-h/2,w,h,isSel?'#fff2c0':'#eadcb4',t.id*3,{amp:.6,lw:isSel?3:2});
    text(c,'Table '+(t.table+1),-w/2+8,-h/2+22,22,INK,'left','700');
    t.items.forEach((it,k)=>{const yy=-h/2+44+k*20;emoji(c,MENU[it.dish].icon,-w/2+16,yy-5,16,it.st==='served'?.3:1);
      text(c,it.st==='served'?'✓':it.st==='making'?'…':'·',-w/2+36,yy,20,it.st==='served'?'#2d7a3a':INK,'left','700');text(c,MENU[it.dish].name.split(' ')[0],-w/2+50,yy,16,INK,'left','500');});
    const cu=R.cust.find(k=>k.id===t.cust);if(cu){const pct=Math.max(0,cu.foodPat/cu.foodMax);rect(c,-w/2+8,h/2-10,w-16,5,'#2a1e30',t.id*5,{amp:.1,lw:1});rect(c,-w/2+9,h/2-9,(w-18)*pct,3,pct>.5?'#6ac05a':pct>.25?'#ffc94d':'#e0553a',t.id*5+1,{lw:0,amp:0});}
    c.restore();
    x-=8;
  }
  const pd=pad();
  if(pd.length)text(c,'🧾 '+pd.length+' receipt'+(pd.length>1?'s':'')+' in pocket',VW-14,r.length?110+r.reduce((m,t)=>Math.max(m,t.items.length),0)*20:34,22,'#fff2c0','right','700',INK);
  else if(!r.length)text(c,'no orders yet',VW-14,34,22,'rgba(255,240,200,.6)','right','500');
  // hands
  const n=cap();
  for(let i=0;i<n;i++){const hx=14+i*54,hy=VH-62;c.save();rr(c,hx,hy,48,48,10);c.fillStyle='rgba(20,12,30,.55)';c.fill();c.setLineDash(R.p.hands[i]?[]:[5,4]);c.lineWidth=2.2;c.strokeStyle='#eadcb4';c.stroke();c.restore();
    const it=R.p.hands[i];if(it){emoji(c,MENU[it.dish].icon,hx+24,hy+24,28);if(!isDone(it))text(c,'→ '+STN_NAME[nextStep(it)].split(' ')[0],hx+24,hy-6,16,'#fff2c0','center','700',INK);else text(c,'serve!',hx+24,hy-6,17,'#9be08a','center','700',INK);}}
  text(c,'hands',14,VH-70,14,'rgba(255,240,200,.55)','left','500');
  // hint
  if(R.hintOn){const h=hintText();if(h){c.font='700 22px Kalam,cursive';const w=Math.min(VW-120,c.measureText(h).width+30);c.save();rr(c,VW/2-w/2,VH-50,w,36,12);c.fillStyle='rgba(20,12,30,.72)';c.fill();c.restore();c.font='700 22px Kalam,cursive';c.fillStyle='#ffe9b0';c.textAlign='center';c.fillText(h,VW/2,VH-26,VW-140);}}
  drawTasks(c);drawBanner(c);drawDlg(c);
  if(R.msg&&!R.dlg){const m=R.msg;c.font='700 22px Kalam,cursive';const w=c.measureText(m.t).width+34;c.globalAlpha=Math.min(1,m.life*2);rr(c,VW/2-w/2,128,w,38,12);c.fillStyle='#eadcb4';c.fill();c.lineWidth=2.5;c.strokeStyle=INK;c.stroke();c.fillStyle=INK;c.textAlign='center';c.fillText(m.t,VW/2,153);c.globalAlpha=1;}
  // mute hint
  [['⏸',VW-56,()=>showPause()],['📖',VW-176,()=>openRecipes()]].forEach(b=>{rr(c,b[1],VH-56,44,44,10);c.fillStyle='rgba(20,12,30,.6)';c.fill();c.lineWidth=2;c.strokeStyle='#eadcb4';c.stroke();emoji(c,b[0],b[1]+22,VH-34,22);HITS.push({x:b[1],y:VH-56,w:44,h:44,fn:b[2]});});
  // big action button (thumb zone)
  if(mode==='play'&&!R.paused){
    const a=curAction();
    if(a){
      const cx=BCX(),cy=BCY(),pulse=1+Math.sin(T*6)*.06,st=!!a.stairs,up=st&&R.p.f<2,dn=st&&R.p.f>0;
      const kx=BTN.id!==null?Math.max(-12,Math.min(12,BTN.dx*.4)):0,ky=BTN.id!==null&&st?Math.max(-34,Math.min(34,BTN.dy*.8)):0;
      c.save();
      const g=c.createRadialGradient(cx,cy,BR*.4,cx,cy,BR*1.9);g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(1,'rgba(255,190,90,0)');c.fillStyle=g;c.beginPath();c.arc(cx,cy,BR*1.9*pulse,0,6.3);c.fill();
      if(st){c.strokeStyle='rgba(255,236,190,.9)';c.lineWidth=3;rr(c,cx-34,cy-(up?96:50),68,(up?96:50)+(dn?96:50),34);c.stroke();
        if(up)text(c,'▲',cx,cy-62,30,'#fff2c0','center','700',INK);if(dn)text(c,'▼',cx,cy+78,30,'#fff2c0','center','700',INK);}
      c.beginPath();c.arc(cx+kx,cy+ky,BR*pulse*(BTN.id!==null?.92:1),0,6.3);c.fillStyle='#ffb54d';c.fill();c.lineWidth=4;c.strokeStyle=INK;c.stroke();
      c.beginPath();c.arc(cx+kx,cy+ky,BR*.78,0,6.3);c.lineWidth=2;c.strokeStyle='rgba(26,18,36,.45)';c.stroke();
      textInk(c,'?',cx+kx,cy+ky,st?44:60,INK);
      if(a.o){c.font='700 20px Kalam,cursive';const w=Math.min(300,c.measureText(a.o.label).width+28);rr(c,cx-BR-14-w,cy-17,w,34,10);c.fillStyle='rgba(246,236,208,.96)';c.fill();c.lineWidth=2;c.strokeStyle=INK;c.stroke();c.fillStyle=INK;c.textAlign='right';c.fillText(a.o.label,cx-BR-26,cy+6,w-20);}
      c.restore();
    }
  }
  // action ring
  if(R.p.act){const a=R.p.act;c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.5)';c.beginPath();c.arc(VW/2,VH/2-40,22,0,6.3);c.stroke();c.strokeStyle='#ffd98a';c.beginPath();c.arc(VW/2,VH/2-40,22,-1.57,-1.57+6.283*(a.t/a.dur));c.stroke();}
  c.restore();
}
function hintText(){
  const P=R.p,h=P.hands;
  const need=R.cust.find(k=>k.state==='order');
  if(pad().length)return P.f===1?'Press the ? button at the ticket rail to pin your receipts. With several tickets, press ? there again to switch.':'Take your receipts up to the kitchen (2F) and pin them.';
  const done=h.find(isDone);
  if(done){const tk=ticketById(done.ticket);if(!tk)return'This dish has no order any more — throw it in the bin.';const tb=R.tables[tk.table];return'Serve '+MENU[done.dish].name+' at table '+(tb.i+1)+' ('+FLOOR_NAME[tb.f]+').';}
  const half=h.find(x=>!isDone(x));
  if(half)return'Next: '+STN_NAME[nextStep(half)]+'. '+(P.f!==1?'Head up to the kitchen (2F).':'');
  if(rail().some(t=>t.items.some(i=>i.st==='pending')))return P.f===1?'Grab ingredients at the fridge. Press ? at the ticket rail to switch tickets.':'Go to the kitchen (2F) and grab ingredients at the fridge.';
  if(need)return'Table '+(need.table+1)+' is ready to order ('+FLOOR_NAME[R.tables[need.table].f]+'). Press the ? button.';
  if(R.tables.some(t=>t.state==='dirty'))return'A table needs clearing.';
  if(R.leak.puddle)return'Mop the puddle on 3F!';
  if(R.leak.on&&R.leak.lvl>.6)return'The leak bucket on 3F is almost full.';
  return'Quiet moment. Pet the cat, or check the diary at the counter.';
}
/* ---------------- render ---------------- */
function blitBld(c){c.drawImage(bld,cam.x*BS,cam.y*BS,VW*BS,VH*BS,cam.x,cam.y,VW,VH);}
function render(){
  HITS=[];
  ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,VW,VH);
  ctx.save();ctx.translate(-cam.x,-cam.y);drawSkyLayer(ctx);ctx.restore();
  drawRain(ctx);
  const shx=(R&&R.shake>0)?(Math.random()-.5)*R.shake*16:0,shy=(R&&R.shake>0)?(Math.random()-.5)*R.shake*16:0;
  ctx.save();ctx.translate(-cam.x+shx,-cam.y+shy);
  blitBld(ctx);
  drawWindowGlass(ctx);
  drawNeonSigns(ctx);
  if(R){
    drawDecor(ctx);drawClock(ctx);
    drawTables(ctx);drawStations(ctx);drawFuse(ctx);drawWerePlant(ctx);drawLeak(ctx);drawCat(ctx);
    for(const k of R.cust)if(!k.sit)drawCustomer(ctx,k);
    drawRamp(ctx);
    // jukebox notes
    if(R.mood!==2&&Math.sin(T*2)>0)text(ctx,R.mood===0?'…':'~',345+Math.sin(T*3)*6,FY[0]-150-((T*20)%30),22,'#ffb6e0','center','700');
    const P=R.p;
    if(!R.trans||R.trans.t<.18)drawPlayer(ctx);
    if(!R.trans||R.trans.t<.18){drawHeld(ctx);drawStairHints(ctx);drawPromptsWorld(ctx);}
    drawParts(ctx);
  }
  ctx.restore();
  if(R){drawLighting(ctx);}
  else{ctx.save();ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='rgba(8,6,30,.4)';ctx.fillRect(0,0,VW,VH);ctx.restore();}
  ctx.save();ctx.setTransform(S,0,0,S,0,0);
  // vignette + grain
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);vg.addColorStop(0,'rgba(5,3,15,0)');vg.addColorStop(1,'rgba(5,3,15,.62)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  ctx.globalAlpha=.07;ctx.globalCompositeOperation='overlay';
  const gx=(Math.floor(T*12)%7)*37,gy=(Math.floor(T*12)%5)*53;ctx.drawImage(grain,-gx,-gy,VW+256,VH+256);
  ctx.restore();
  if(R&&mode!=='title'){drawHUD(ctx);}
  if(R&&R.fade>0){ctx.save();ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='rgba(5,3,15,'+R.fade+')';ctx.fillRect(0,0,VW,VH);ctx.restore();}
  if(R&&R.trans){const t=R.trans.t,a=t<.18?t/.18:1-(t-.18)/.18;ctx.save();ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='rgba(5,3,15,'+Math.max(0,Math.min(1,a))+')';ctx.fillRect(0,0,VW,VH);ctx.restore();}
}
const grain=document.createElement('canvas');grain.width=VW+256;grain.height=VH+256;
(function(){const g=grain.getContext('2d');const id=g.createImageData(grain.width,grain.height);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);})();
/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  BOIL=Math.floor(T*6);
  if(mode==='title'||(mode==='summary'&&!R)){
    cam.x=(Math.sin(T*.12)*.5+.5)*(W-VW);const fl=Math.floor(T/9)%4;const fi=[0,1,2,1][fl];cam.y+=(Math.max(0,Math.min(H-VH,FY[fi]-380))-cam.y)*Math.min(1,dt*1.5);
  }
  if(R&&(mode==='play'||mode==='summary')){
    if(mode==='play'){
      if(pr('KeyM')){setMute(!A.muted);toast(A.muted?'Sound off':'Sound on');}
      if(pr('KeyH'))R.hintOn=!R.hintOn;
      if(pr('KeyP','Escape')){if(R.paused){ACT.resume();}else showPause();}
      else if(pr('KeyR')&&!R.paused)openRecipes();
      else if(pr('Escape')&&R.paused)ACT.resume();
    }
    update(dt);
    const P=R.p;const tx=Math.max(0,Math.min(W-VW,P.x-VW/2+P.face*50)),ty=Math.max(0,Math.min(H-VH,FY[P.f]-390));
    const k=Math.min(1,dt*5);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*Math.min(1,dt*4);
  }else if(mode==='title'&&!R){}
  if(mode==='summary'&&R){R.overT+=dt;updateDlg(dt);if(R.banner){R.banner.t+=dt;if(R.banner.t>6)R.banner=null;}}
  for(const k in pressed)pressed[k]=false;
  ambienceTick();
  if(mode==='title'||R)render();
  requestAnimationFrame(frame);
}
function boot(){
  load();resize();bld=buildBackground();sky=buildSky();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bld=buildBackground();});
  showTitle();requestAnimationFrame(frame);
  let miss=false;try{miss=!localStorage.getItem(SAVE_KEY);}catch(e){miss=true;}
  if(miss)Promise.all([idbGet(SAVE_KEY),idbGet(SLOT_KEY)]).then(r=>{if(r[0]&&save.night===1&&mode==='title'){try{const o=JSON.parse(r[0]);save=Object.assign(DEF(),o);save.up=Object.assign(DEF().up,o.up||{});}catch(e){}}
    if(r[1]&&!slots.length){try{slots=JSON.parse(r[1])||[];}catch(e){}}if(mode==='title')showTitle();});
}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
